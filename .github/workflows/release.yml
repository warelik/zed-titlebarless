        with:
          ref: ${{ inputs.policy_ref || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: warelik/machine-maintenance
          ref: 49f021fca0c8e214bc28195d2cc993803946b562
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          path: maintenance-verifier
          persist-credentials: false
      - name: Read The Exact Private Maintenance Lock
        id: maintenance
        run: |
          python3 -B - "candidate/scripts/maintenance.lock.json" \
            "workflow-source/scripts/maintenance.lock.json" \
            "candidate/scripts/maintenance.py" "workflow-source/scripts/maintenance.py" \
            "maintenance-verifier/fork_lifecycle.py" >> "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          candidate_lock, workflow_lock, candidate_loader, workflow_loader, verifier_core = map(pathlib.Path, sys.argv[1:])
          paths = (candidate_lock, workflow_lock, candidate_loader, workflow_loader, verifier_core)
          if any(path.is_symlink() or not path.is_file() for path in paths):
              raise SystemExit("Candidate, native-workflow and private-verifier inputs must be regular files")
          if candidate_loader.read_bytes() != workflow_loader.read_bytes():
              raise SystemExit("Candidate public loader differs from the native workflow-source loader")
          if candidate_lock.read_bytes() != workflow_lock.read_bytes():
              raise SystemExit("Candidate maintenance lock differs from the native workflow-source lock")
          lock = json.loads(candidate_lock.read_text(encoding="utf-8"))
          if (lock.get("repository") != "warelik/machine-maintenance"
                  or not re.fullmatch(r"[0-9a-f]{40}", lock.get("revision", ""))
                  or not re.fullmatch(r"[0-9a-f]{64}", lock.get("module_sha256", ""))
                  or lock.get("api_version") != 1 or lock.get("schema") != 1):
              raise SystemExit("The reviewed maintenance revision is invalid")
          print("revision=" + lock["revision"])
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.maintenance.outputs.revision }}
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          path: maintenance
          persist-credentials: false
      - name: Record The Acquired Private Source Identity
        env:
          MAINTENANCE_REVISION: ${{ steps.maintenance.outputs.revision }}
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, re, subprocess
          verifier_root = pathlib.Path("maintenance-verifier")
          expected_verifier = "49f021fca0c8e214bc28195d2cc993803946b562"
          verifier_rev = subprocess.check_output(
              ["git", "-C", str(verifier_root), "rev-parse", "HEAD"], text=True).strip()
          if (not re.fullmatch(r"[0-9a-f]{40}", expected_verifier)
                  or verifier_rev != expected_verifier):
              raise SystemExit("Accepted private verifier checkout differs from its pinned immutable revision")
          (verifier_root / ".maintenance-source.json").write_text(json.dumps({
              "repository": "warelik/machine-maintenance", "revision": verifier_rev}))
          root = pathlib.Path("maintenance")
          revision = os.environ["MAINTENANCE_REVISION"]
          actual = subprocess.check_output(
              ["git", "-C", str(root), "rev-parse", "HEAD"], text=True).strip()
          if actual != revision:
              raise SystemExit("Private checkout differs from its exact revision")
          (root / ".maintenance-source.json").write_text(json.dumps({
              "repository": "warelik/machine-maintenance", "revision": revision}))
          PY
      - name: Verify The Complete Native Pair And Private Policy Receipt
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          POLICY_REF: ${{ inputs.policy_ref || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          FULL_PR: ${{ inputs.full_pr }}
          DELTA_PR: ${{ inputs.delta_pr }}
        run: |
          python3 -B - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, re, subprocess, sys, urllib.parse, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          owner = repo.split('/')[0]
          public_token = os.environ['GH_TOKEN']
          private_token = os.environ['CODEX_REQUEST_TOKEN']
          class NativeRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  target = urllib.parse.urlsplit(new_url)
                  if target.scheme != 'https' or target.netloc != 'api.github.com':
                      raise ValueError('Native API redirect leaves the authenticated GitHub host')
                  return super().redirect_request(request, fp, code, message, headers, new_url)
          opener = urllib.request.build_opener(NativeRedirects())
          def native_api(route, *, token=None):
              auth = token or public_token
              headers = {'Accept': 'application/vnd.github+json',
                         'Authorization': f'Bearer {auth}',
                         'X-GitHub-Api-Version': '2022-11-28',
                         'User-Agent': 'zed-bootstrap-verifier'}
              req = urllib.request.Request('https://api.github.com/' + route.lstrip('/'),
                                           headers=headers, method='GET')
              with opener.open(req, timeout=60) as resp:
                  raw = resp.read().decode('utf-8')
              return json.loads(raw) if raw.strip() else None
          def native_pages(route):
              result = []
              sep = '&' if '?' in route else '?'
              for page in range(1, 1001):
                  batch = native_api(f'{route}{sep}per_page=100&page={page}')
                  if not isinstance(batch, list):
                      raise ValueError('Expected a paginated GitHub list')
                  result.extend(batch)
                  if len(batch) < 100:
                      return result
              raise ValueError('GitHub pagination did not terminate')
          def load_private_core(directory, expected_lock=None):
              root = pathlib.Path(directory)
              if root.is_symlink() or not root.is_dir():
                  raise SystemExit('Private maintenance root must be a regular directory')
              receipt_path = root / '.maintenance-source.json'
              module_path = root / 'fork_lifecycle.py'
              if any(p.is_symlink() or not p.is_file() for p in (receipt_path, module_path)):
                  raise SystemExit('Private maintenance source receipt or module is missing')
              source_receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
              if (source_receipt.get('repository') != 'warelik/machine-maintenance'
                      or not re.fullmatch(r'[0-9a-f]{40}', source_receipt.get('revision', ''))):
                  raise SystemExit('Private maintenance source receipt is malformed')
              raw = module_path.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if expected_lock is not None:
                  if (source_receipt.get('revision') != expected_lock.get('revision')
                          or digest != expected_lock.get('module_sha256')):
                      raise SystemExit('Private maintenance checkout differs from the candidate lock')
              name = '_private_fork_lifecycle_' + digest
              spec = importlib.util.spec_from_file_location(name, module_path)
              if spec is None or spec.loader is None:
                  raise SystemExit('Unable to prepare private lifecycle module spec')
              mod = importlib.util.module_from_spec(spec)
              try:
                  spec.loader.exec_module(mod)
              except Exception as error:
                  raise SystemExit('Private checked-bundle verification failed: ' + type(error).__name__ + ': ' + str(error)) from None
              if getattr(mod, 'API_VERSION', None) != 1:
                  raise SystemExit('Private lifecycle API version is unsupported')
              mod._maintenance_lock_identity = {
                  'repository': 'warelik/machine-maintenance',
                  'revision': source_receipt['revision'],
                  'module_sha256': digest,
                  'api_version': 1,
              }
              return mod
          policy = subprocess.check_output(['git', '-C', 'candidate', 'rev-parse', 'HEAD'], text=True).strip()
          workflow_sha = os.environ['WORKFLOW_SHA']
          workflow_source = pathlib.Path('workflow-source').resolve()
          if (not re.fullmatch(r'[0-9a-f]{40}', workflow_sha)
                  or policy != os.environ['POLICY_REF'] or policy != os.environ['GITHUB_SHA']
                  or workflow_sha != os.environ['GITHUB_SHA']
                  or subprocess.check_output(['git', '-C', str(workflow_source), 'rev-parse', 'HEAD'],
                                             text=True).strip() != workflow_sha):
              raise SystemExit('Bootstrap policy must be the exact dispatched default-branch revision')
          if (pathlib.Path('candidate/scripts/maintenance.py').read_bytes()
                  != (workflow_source / 'scripts/maintenance.py').read_bytes()):
              raise SystemExit('Candidate loader changed after its native workflow-source comparison')
          default_head = (native_api(f'repos/{repo}/commits/downstream') or {}).get('sha')
          if default_head != policy or default_head != workflow_sha:
              raise SystemExit('Trusted default branch moved; restart the bundle bootstrap for its exact head')
          full_pr = os.environ['FULL_PR']
          if not re.fullmatch(r'[1-9][0-9]*', full_pr):
              raise SystemExit('The exact complete-project review PR is required')
          comments = native_pages(f'repos/{repo}/issues/{full_pr}/comments')
          receipts = []
          pattern = re.compile(r'<!-- machine-maintenance-bundle:v1 (\{[^\n]*\}) -->')
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('Duplicate JSON field in native bundle receipt')
                  result[key] = value
              return result
          for comment in comments:
              user = comment.get('user') or {}
              if user.get('login') != owner or user.get('type') != 'User':
                  continue
              markers = pattern.findall(comment.get('body') or '')
              if len(markers) > 1:
                  raise SystemExit('Owner bundle comment has duplicated native marker')
              if not markers:
                  continue
              try:
                  receipt = json.loads(markers[0], object_pairs_hook=unique)
                  target = receipt['manifest']['targets'][repo]
              except (KeyError, TypeError, ValueError) as error:
                  raise SystemExit('Owner bundle comment has no exact Zed manifest candidate') from error
              candidate = target.get('candidate') if isinstance(target, dict) else None
              if (isinstance(candidate, dict)
                      and candidate.get('configuration_sha') == policy
                      and target.get('full', {}).get('pr') == int(full_pr)):
                  receipts.append((candidate, target, comment, receipt))
          if len(receipts) != 1:
              raise SystemExit('Exactly one private bundle receipt must bind this exact policy and full-review PR')
          candidate, target, comment, receipt = receipts[0]
          delta_pr = str(target['delta']['pr'])
          if os.environ['DELTA_PR'] and os.environ['DELTA_PR'] != delta_pr:
              raise SystemExit('Dispatched delta PR differs from the private manifest')
          private_route = re.compile(
              r'repos/warelik/machine-maintenance/(?:'
              r'actions/variables/(?:MAINTENANCE_VALIDATION_MANIFEST|MAINTENANCE_TRUSTED_DISPATCHER)|'
              r'contents/(?:fork_lifecycle\.py|bootstrap\.py|bundle_runner\.py|'
              r'\.github/workflows/policy\.yml)\?ref=[0-9a-f]{40}|'
              r'git/blobs/[0-9a-f]{40}|'
              r'actions/runs/[1-9][0-9]*/attempts/[1-9][0-9]*(?:/jobs)?'
              r'(?:\?per_page=100&page=[1-9][0-9]*)?)')
          def read_native(route):
              if not isinstance(route, str) or '\n' in route or '\r' in route:
                  raise ValueError('Malformed native GET route')
              if route.startswith(f'repos/{repo}/'):
                  return native_api(route)
              if private_route.fullmatch(route):
                  return native_api(route, token=private_token)
              raise ValueError('The private receipt verifier requested an unexpected native route')
          try:
              checked_verifier = load_private_core(pathlib.Path('maintenance-verifier').resolve())
              manifest = checked_verifier._bundle_manifest(receipt.get('manifest'))
              manifest_hash = checked_verifier._bundle_manifest_hash(manifest)
              private_run = receipt.get('private_run')
              if (set(receipt) != {'schema', 'manifest_sha256', 'manifest', 'private_run'}
                      or type(receipt.get('schema')) is not int or receipt['schema'] != 1
                      or receipt.get('manifest_sha256') != manifest_hash
                      or not isinstance(private_run, dict)
                      or set(private_run) != {'id', 'run_attempt', 'dispatcher_sha'}
                      or any(type(private_run.get(key)) is not int or private_run[key] <= 0
                             for key in ('id', 'run_attempt'))
                      or private_run.get('dispatcher_sha') != manifest['shared']['dispatcher_sha']
                      or type(comment.get('id')) is not int or comment['id'] <= 0):
                  raise SystemExit('Owner receipt does not bind an exact private validation attempt')
              native_comments = checked_verifier._bundle_native_pages(
                  read_native, f'repos/{repo}/issues/{full_pr}/comments')
              if comments != native_comments or comment not in native_comments:
                  raise SystemExit('Owner receipt differs from the complete native comment evidence')
              shared = manifest['shared']
              candidate_lock = json.loads(pathlib.Path('candidate/scripts/maintenance.lock.json').read_text())
              source_fields = ('repository', 'revision', 'module_sha256', 'api_version')
              if {key: candidate_lock[key] for key in source_fields} != {
                      key: shared[key] for key in source_fields}:
                  raise SystemExit('Candidate lock differs from the privately validated source')
              # Authenticate the final run with checked private code before loading the candidate lock module.
              checked_verifier._bundle_source_hash(read_native, shared)
              _, _, finished = checked_verifier._bundle_private_run(
                  read_native, receipt, manifest_hash, shared)
              created = checked_verifier._timestamp(comment.get('created_at'))
              if (checked_verifier._timestamp(comment.get('updated_at')) != created
                      or created < finished):
                  raise SystemExit('Owner receipt was edited or predates final private validation')
              maintenance = load_private_core(pathlib.Path('maintenance').resolve(), expected_lock=candidate_lock)
              proof = maintenance.validated_bundle(candidate, comments, read_native)
              if (not isinstance(proof, dict) or proof.get('decision') != 'reuse-policy-validation'
                      or proof.get('candidate_id') != maintenance.candidate_identity(candidate)
                      or proof.get('shared_source') != maintenance._maintenance_lock_identity
                      or proof.get('heavy_build_allowed') is not False
                      or proof.get('application_artifact_verified') is not False):
                  raise SystemExit('Private bundle did not prove exact policy validation without authorizing a build')
          except Exception as error:
              raise SystemExit('Private checked-bundle verification failed: ' + type(error).__name__ + ': ' + str(error)) from None
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('verified=true\n')
              out.write('policy_ref=' + policy + '\n')
              out.write('maintenance_candidate=' + json.dumps(candidate, sort_keys=True, separators=(',', ':')) + '\n')
              out.write('delta_pr=' + delta_pr + '\n')
              out.write('delta_base=' + target['delta']['base_sha'] + '\n')
              out.write('upstream=' + candidate['upstream_sha'] + '\n')
          PY
