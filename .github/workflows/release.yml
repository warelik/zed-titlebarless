name: Upstream Plus Patches

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [downstream]
    paths: ["patches/**", "scripts/**", ".github/workflows/release.yml"]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: upstream-plus-patches
  cancel-in-progress: false

jobs:
  prepare:
    name: Select One Snapshot And Request Review
    if: >-
      (github.event_name != 'issue_comment' &&
       github.event_name != 'pull_request_target') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       github.event.comment.user.type == 'Bot') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'downstream' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'repair/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      ready: ${{ steps.snapshot.outputs.ready }}
      sha: ${{ steps.snapshot.outputs.sha }}
      upstream: ${{ steps.snapshot.outputs.upstream }}
      patchset: ${{ steps.snapshot.outputs.patchset }}
      version: ${{ steps.snapshot.outputs.version }}
      release: ${{ steps.snapshot.outputs.release }}
      release_id: ${{ steps.snapshot.outputs.release_id }}
      source_depth: ${{ steps.snapshot.outputs.source_depth }}
      pr: ${{ steps.snapshot.outputs.pr }}
      mode: ${{ steps.snapshot.outputs.mode }}
      repair_pr: ${{ steps.snapshot.outputs.repair_pr }}
      repair_head: ${{ steps.snapshot.outputs.repair_head }}
      followup: ${{ steps.snapshot.outputs.followup }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require The Trusted Default Branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$DEFAULT_BRANCH" = downstream
      - name: Test Release Policy
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Prepare The Exact Source And Review
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
        run: python3 scripts/release.py prepare "$RUNNER_TEMP/zed-source"
      - name: Report The Actual State
        if: always()
        env:
          READY: ${{ steps.snapshot.outputs.ready }}
          REASON: ${{ steps.snapshot.outputs.reason }}
          SOURCE_SHA: ${{ steps.snapshot.outputs.sha }}
          VERSION: ${{ steps.snapshot.outputs.version }}
          PR: ${{ steps.snapshot.outputs.pr }}
        run: |
          {
            echo "### Upstream plus patches"
            printf '%s\n' "- State: ${REASON:-stopped before a decision}"
            printf '%s\n' "- Review accepted: ${READY:-false}"
            if [ -n "$SOURCE_SHA" ]; then printf '%s\n' "- Application: $VERSION at $SOURCE_SHA"; fi
            if [ -n "$PR" ]; then printf '%s\n' "- Review PR: #$PR"; fi
            echo "- Publication is not a restart or validation of an existing editor"
          } >> "$GITHUB_STEP_SUMMARY"

  policy-check:
    name: Check Proposed Policy Without Write Credentials
    needs: prepare
    if: always() && needs.prepare.outputs.mode == 'policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.repair_head }}
          path: candidate
          persist-credentials: false
      - name: Enforce Trusted Tests And Validate Proposed YAML
        run: python3 trusted/scripts/release.py check-policy "$GITHUB_WORKSPACE/candidate"

  test:
    name: Test, Build And Inspect One macOS Application
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.mode == 'application'
    runs-on: macos-15
    timeout-minutes: 355
    env:
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
      CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
      PATCHSET_SHA256: ${{ needs.prepare.outputs.patchset }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      CONFIG_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: ${{ needs.prepare.outputs.source_depth }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Free Space On The Disposable macOS Runner
        run: |
          df -h /
          keep=$(realpath "$(xcode-select -p)/../..")
          for xcode in /Applications/Xcode*.app; do
            [ "$(realpath "$xcode")" = "$keep" ] || sudo rm -rf "$xcode"
          done
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet ~/hostedtoolcache/CodeQL
          df -h /
      - name: Run Every Preserved Rust Regression
        run: python3 trusted/scripts/release.py test "$GITHUB_WORKSPACE/app"
      - name: Build And Inspect The Exact Reviewed Application
        if: needs.prepare.outputs.repair_pr == ''
        run: python3 trusted/scripts/release.py build "$GITHUB_WORKSPACE/app"
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.repair_pr == ''
        with:
          name: reviewed-${{ needs.prepare.outputs.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Recheck Review And Publish Without Restarting Editors
    needs: [prepare, test]
    if: needs.prepare.outputs.repair_pr == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-${{ needs.prepare.outputs.sha }}
          path: release
      - name: Publish Only This Verified Candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          CANDIDATE_PR: ${{ needs.prepare.outputs.pr }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
          PATCHSET_SHA256: ${{ needs.prepare.outputs.patchset }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          REPAIR_HEAD: ${{ needs.prepare.outputs.repair_head }}
        run: python3 scripts/release.py publish "$GITHUB_WORKSPACE/release"

  land:
    name: Adopt Only The Verified Repair And Restart Verification
    needs: [prepare, policy-check, test]
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.ready == 'true' &&
      needs.prepare.outputs.repair_pr != '' &&
      ((needs.prepare.outputs.mode == 'policy' && needs.policy-check.result == 'success') ||
       (needs.prepare.outputs.mode == 'application' && needs.test.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck Review, Adopt The Diff, And Dispatch A Fresh Cycle
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_PR: ${{ needs.prepare.outputs.repair_pr }}
          REPAIR_HEAD: ${{ needs.prepare.outputs.repair_head }}
          CANDIDATE_PR: ${{ needs.prepare.outputs.pr }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
        run: python3 scripts/release.py land "$RUNNER_TEMP/zed-land"

  repair:
    name: Request Native Codex Repair Or Escalate Explicitly
    needs: [prepare, policy-check, test, publish, land]
    if: always() && (contains(needs.*.result, 'failure') || needs.prepare.outputs.followup == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Repair The Actual Failure Without Publishing Or Disrupting Editors
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
          CANDIDATE_PR: ${{ needs.prepare.outputs.pr }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          REPAIR_HEAD: ${{ needs.prepare.outputs.repair_head }}
          NONBLOCKING_FOLLOWUP: ${{ !contains(needs.*.result, 'failure') && needs.prepare.outputs.followup == 'true' }}
        run: python3 scripts/release.py repair "$RUNNER_TEMP/zed-repair"
