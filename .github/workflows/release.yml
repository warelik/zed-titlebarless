name: Release

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to build (defaults to the latest stable release)
        required: false
      force:
        description: Rebuild even if the release already exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          tag="${INPUT_TAG:-$(gh release view --repo zed-industries/zed --json tagName --jq .tagName)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != true ] && gh release view "$tag-titlebarless" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 355
    env:
      TAG: ${{ needs.check.outputs.tag }}
      RELEASE: ${{ needs.check.outputs.tag }}-titlebarless
    steps:
      - uses: actions/checkout@v4
        with:
          path: fork

      - name: Check out upstream and apply patches
        run: |
          git clone --depth 1 --branch "$TAG" https://github.com/zed-industries/zed.git zed
          cd zed
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com am ../fork/patches/*.patch

      - name: Free disk space
        run: |
          df -h /
          keep=$(realpath "$(xcode-select -p)/../..")
          for xcode in /Applications/Xcode*.app; do
            [ "$(realpath "$xcode")" = "$keep" ] || sudo rm -rf "$xcode"
          done
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet ~/hostedtoolcache/CodeQL
          df -h /

      - name: Build
        working-directory: zed
        env:
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
          ZED_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: ./script/bundle-mac aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: Zed-aarch64.dmg
          path: zed/target/aarch64-apple-darwin/release/Zed-aarch64.dmg
          if-no-files-found: error

      - name: Package debug symbols
        run: |
          version="${TAG#v}"
          target_dir="zed/target/aarch64-apple-darwin/release"
          symbols_archive="zed-${version}-titlebarless-debug-symbols-macos-aarch64.tar.gz"
          echo "SYMBOLS_ARCHIVE=$target_dir/$symbols_archive" >> "${GITHUB_ENV:-/dev/null}"

          for dwarf in "$target_dir/zed.dwarf" "$target_dir/remote_server.dwarf"; do
            if [ ! -f "$dwarf" ]; then
              echo "Error: missing expected debug symbols file: $dwarf" >&2
              exit 1
            fi
            if [ ! -s "$dwarf" ]; then
              echo "Error: debug symbols file is empty: $dwarf" >&2
              exit 1
            fi
            has_dwarf=false
            while IFS= read -r line; do
              if [[ "$line" == *"DW_TAG_compile_unit"* ]]; then
                has_dwarf=true
                break
              fi
            done < <(dwarfdump --debug-info "$dwarf" 2>/dev/null || true)

            if [ "$has_dwarf" != true ]; then
              echo "Error: $dwarf contains no DWARF debug info" >&2
              exit 1
            fi
          done

          (
            cd "$target_dir"
            dwarfdump -u zed.dwarf remote_server.dwarf > UUIDS.txt
            cat UUIDS.txt
            tar -czf "$symbols_archive" zed.dwarf remote_server.dwarf UUIDS.txt
            ls -l zed.dwarf remote_server.dwarf "$symbols_archive"
          )

          archive_size=$(wc -c < "$target_dir/$symbols_archive")
          max_bytes=$((2 * 1024 * 1024 * 1024))
          if [ "$archive_size" -gt "$max_bytes" ]; then
            echo "Error: symbols archive $symbols_archive ($archive_size bytes) exceeds GitHub 2 GiB per-asset limit" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          dmg="zed/target/aarch64-apple-darwin/release/Zed-aarch64.dmg"
          symbols_archive="${SYMBOLS_ARCHIVE:-zed/target/aarch64-apple-darwin/release/zed-${version}-titlebarless-debug-symbols-macos-aarch64.tar.gz}"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE/Zed-aarch64.dmg"
          printf '{"version":"%s","url":"%s"}\n' "$version" "$url" > latest.json
          {
            echo "Zed [$TAG](https://github.com/zed-industries/zed/releases/tag/$TAG) + [patches](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA/patches)."
            echo
            cat fork/RELEASE_NOTES.md
          } > notes.md

          ls -l "$dmg" latest.json "$symbols_archive"

          max_bytes=$((2 * 1024 * 1024 * 1024))
          for asset in "$dmg" "$symbols_archive"; do
            size=$(wc -c < "$asset")
            if [ "$size" -gt "$max_bytes" ]; then
              echo "Error: asset $asset ($size bytes) exceeds GitHub 2 GiB per-asset limit" >&2
              exit 1
            fi
          done

          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$RELEASE" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$RELEASE" "$dmg" latest.json "$symbols_archive" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Zed $version titlebarless (macOS arm64)" --notes-file notes.md
