          import release
          release.ROOT = pathlib.Path('configuration').resolve()
          release.land_repair(pathlib.Path(os.environ['RUNNER_TEMP']) / 'zed-land')
          PY

  activate-policy:
    name: Activate Only The Exact Checked Policy
    needs: [prepare, policy-check, verify-bootstrap-bundle]
    if: >-
      always() && needs.prepare.result == 'success' && needs.prepare.outputs.ready == 'true' &&
      (needs.policy-check.result == 'success' || needs.prepare.outputs.policy_verified == 'true') && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      policy_ref: ${{ steps.pin.outputs.policy_ref }}
      final_failed: ${{ steps.history.outputs.final_failed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checked_policy || needs.prepare.outputs.candidate_config }}
          path: checked
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: ${{ needs.prepare.outputs.source_depth }}
          path: app
          persist-credentials: false
      - name: Read The Exact Private Maintenance Lock
        id: maintenance
        run: |
          python3 -B - "checked/scripts/maintenance.lock.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          if path.is_symlink() or not path.is_file():
              raise SystemExit("The reviewed maintenance lock is missing")
          lock = json.loads(path.read_text())
          if lock.get("repository") != "warelik/machine-maintenance" or not re.fullmatch(r"[0-9a-f]{40}", lock.get("revision", "")):
              raise SystemExit("The reviewed maintenance revision is invalid")
          print("revision=" + lock["revision"])
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.maintenance.outputs.revision }}
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          path: maintenance
          persist-credentials: false
      - name: Record The Acquired Private Source Identity
        env:
          MAINTENANCE_REVISION: ${{ steps.maintenance.outputs.revision }}
        run: |
          test "$(git -C maintenance rev-parse HEAD)" = "$MAINTENANCE_REVISION"
          python3 -B - <<'PY'
          import json, os, pathlib
          pathlib.Path("maintenance/.maintenance-source.json").write_text(json.dumps({
              "repository": "warelik/machine-maintenance",
              "revision": os.environ["MAINTENANCE_REVISION"]}))
          PY
      - name: Verify Recipes With The Exact Sandbox-Checked Controller Before macOS
        env:
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
        run: python3 checked/scripts/release.py check-upstream-recipe "$GITHUB_WORKSPACE/app"
      - name: Recheck The Exact Shared Reviews And Current Attempt Reservation
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          CANDIDATE_PR: ${{ needs.prepare.outputs.pr }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
          PATCHSET_SHA256: ${{ needs.prepare.outputs.patchset }}
          REVIEW_CONFIG_SHA: ${{ needs.prepare.outputs.candidate_config }}
          MAINTENANCE_CANDIDATE: ${{ needs.prepare.outputs.maintenance_candidate }}
          MAINTENANCE_BASELINE: ${{ needs.prepare.outputs.maintenance_baseline }}
          FULL_REVIEW_SHA: ${{ needs.prepare.outputs.full_review_sha }}
          DELTA_PR: ${{ needs.prepare.outputs.delta_pr }}
          DELTA_BASE: ${{ needs.prepare.outputs.delta_base }}
          DELTA_SHA: ${{ needs.prepare.outputs.delta_sha }}
          REPAIR_PR: ${{ needs.prepare.outputs.repair_pr }}
          FORK_FINAL_CANDIDATE: ${{ needs.prepare.outputs.final_candidate }}
          FORK_FINAL_RUN_ID: ${{ needs.prepare.outputs.final_run_id }}
          FORK_FINAL_ATTEMPT: ${{ needs.prepare.outputs.final_attempt }}
          FORK_FINAL_WORKFLOW_SHA: ${{ needs.prepare.outputs.final_workflow_sha }}
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path('checked/scripts').resolve()))
          import release
          try:
              repo = os.environ['GITHUB_REPOSITORY']
              candidate = release.strict_json(os.environ['MAINTENANCE_CANDIDATE'],
                  'Frozen maintenance candidate')
              release.check_shared_publication(repo, os.environ['REVIEW_CONFIG_SHA'],
                  os.environ['CANDIDATE_SHA'], os.environ['UPSTREAM_SHA'], os.environ['PATCHSET_SHA256'])
              if os.environ['FORK_FINAL_CANDIDATE']:
                  release.reauthorize_reserved_final(candidate, json.loads(os.environ['MAINTENANCE_BASELINE']),
                      candidate_id=os.environ['FORK_FINAL_CANDIDATE'], run_id=os.environ['FORK_FINAL_RUN_ID'],
                      run_attempt=os.environ['FORK_FINAL_ATTEMPT'], workflow_sha=os.environ['FORK_FINAL_WORKFLOW_SHA'])
          except Exception:
              release.output(final_failed=True)
              raise
          PY
      - name: Pin The Checked Controller For Subsequent Runs
        id: pin
        env:
          GH_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          POLICY_REF: ${{ needs.prepare.outputs.checked_policy || needs.prepare.outputs.candidate_config }}
          REPAIR_PR: ${{ needs.prepare.outputs.repair_pr }}
        run: |
          [[ "$POLICY_REF" =~ ^[0-9a-f]{40}$ ]]
          if [ -z "$REPAIR_PR" ]; then
            gh variable set ZED_TRUSTED_POLICY --repo "$GITHUB_REPOSITORY" --body "$POLICY_REF"
          fi
          echo "policy_ref=$POLICY_REF" >> "$GITHUB_OUTPUT"
      - name: Finish Policy-Only Maintenance Without Rebuilding The Published Application
        if: needs.prepare.outputs.already_published == 'true' && needs.prepare.outputs.repair_pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          FULL_REVIEW_SHA: ${{ needs.prepare.outputs.full_review_sha }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
          PATCHSET_SHA256: ${{ needs.prepare.outputs.patchset }}
          DELTA_PR: ${{ needs.prepare.outputs.delta_pr }}
          DELTA_BASE: ${{ needs.prepare.outputs.delta_base }}
          DELTA_SHA: ${{ needs.prepare.outputs.delta_sha }}
        run: |
          python3 -B - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path('checked/scripts').resolve()))
          import release
          upstream, patchset = os.environ['UPSTREAM_SHA'], os.environ['PATCHSET_SHA256']
          release.close_published_reviews(os.environ['GITHUB_REPOSITORY'],
              os.environ['FULL_REVIEW_SHA'], upstream,
              f"review/{os.environ['FULL_REVIEW_SHA']}", shared=True)
          PY

  repair:
    name: Request Native Codex Repair Or Escalate Explicitly
    needs: [prepare, policy-check, test, publish, land, verify-bootstrap-bundle, activate-policy]
    if: >-
      always() && github.ref == 'refs/heads/downstream' &&
      github.event.repository.default_branch == 'downstream' &&
      (contains(needs.*.result, 'failure') || needs.prepare.outputs.followup == 'true') &&
      (vars.ZED_TRUSTED_POLICY != '' ||
       needs.verify-bootstrap-bundle.result == 'success' ||
       needs.verify-bootstrap-bundle.result == 'failure') && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        if: needs.activate-policy.outputs.policy_ref != '' || needs.verify-bootstrap-bundle.result == 'success' || needs.prepare.outputs.trusted_policy != '' || vars.ZED_TRUSTED_POLICY != ''
        with:
          ref: ${{ needs.activate-policy.outputs.policy_ref || (needs.verify-bootstrap-bundle.result == 'success' && needs.verify-bootstrap-bundle.outputs.policy_ref) || needs.prepare.outputs.trusted_policy || vars.ZED_TRUSTED_POLICY }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.land.outputs.config || github.sha }}
          path: configuration
          persist-credentials: false
      - name: Read The Exact Private Maintenance Lock
        if: needs.verify-bootstrap-bundle.result != 'failure'
        id: maintenance
        run: |
          python3 -B - "trusted/scripts/maintenance.lock.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          if path.is_symlink() or not path.is_file():
              raise SystemExit("The reviewed maintenance lock is missing")
          lock = json.loads(path.read_text())
          if lock.get("repository") != "warelik/machine-maintenance" or not re.fullmatch(r"[0-9a-f]{40}", lock.get("revision", "")):
              raise SystemExit("The reviewed maintenance revision is invalid")
          print("revision=" + lock["revision"])
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.verify-bootstrap-bundle.result != 'failure'
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.maintenance.outputs.revision }}
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          path: maintenance
          persist-credentials: false
      - name: Record The Acquired Private Source Identity
        if: needs.verify-bootstrap-bundle.result != 'failure'
        env:
          MAINTENANCE_REVISION: ${{ steps.maintenance.outputs.revision }}
        run: |
          test "$(git -C maintenance rev-parse HEAD)" = "$MAINTENANCE_REVISION"
          python3 -B - <<'PY'
          import json, os, pathlib
          pathlib.Path("maintenance/.maintenance-source.json").write_text(json.dumps({
              "repository": "warelik/machine-maintenance",
              "revision": os.environ["MAINTENANCE_REVISION"]}))
          PY
      - name: Repair The Actual Failure Without Publishing Or Disrupting Editors
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream || needs.verify-bootstrap-bundle.outputs.upstream }}
          CANDIDATE_PR: ${{ needs.prepare.outputs.pr }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          FULL_REVIEW_SHA: ${{ needs.prepare.outputs.full_review_sha }}
          MAINTENANCE_CANDIDATE: ${{ needs.prepare.outputs.maintenance_candidate }}
          REPAIR_HEAD: ${{ needs.prepare.outputs.repair_head }}
          NONBLOCKING_FOLLOWUP: ${{ !contains(needs.*.result, 'failure') && needs.prepare.outputs.followup == 'true' }}
          FINAL_VALIDATION_FAILED: ${{ needs.test.result == 'failure' || needs.publish.result == 'failure' || needs.prepare.outputs.final_failed == 'true' || needs.activate-policy.outputs.final_failed == 'true' }}
          BOOTSTRAP_BUNDLE_FAILED: ${{ needs.verify-bootstrap-bundle.result == 'failure' }}
          BOOTSTRAP_FULL_PR: ${{ inputs.full_pr }}
          BOOTSTRAP_DELTA_PR: ${{ inputs.delta_pr }}
          CONFIG_SHA: ${{ needs.land.outputs.config || github.sha }}
          DELTA_PR: ${{ needs.prepare.outputs.delta_pr }}
          DELTA_BASE: ${{ needs.prepare.outputs.delta_base }}
          DELTA_SHA: ${{ needs.prepare.outputs.delta_sha }}
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, re, sys, urllib.error, urllib.parse, urllib.request
          trusted_scripts = pathlib.Path('trusted/scripts')
          if trusted_scripts.joinpath('release.py').is_file():
              sys.path.insert(0, str(trusted_scripts.resolve()))
              import release
              release.ROOT = pathlib.Path('configuration').resolve()
              if os.environ['BOOTSTRAP_BUNDLE_FAILED'] == 'true':
                  repo = os.environ['GITHUB_REPOSITORY']
                  upstream = os.environ['UPSTREAM_SHA']
                  full_pr = os.environ['BOOTSTRAP_FULL_PR']
                  if not release.SHA.fullmatch(upstream or '') and full_pr.isdigit():
                      pull = release.api(f"repos/{repo}/pulls/{full_pr}")
                      base, head = pull.get('base') or {}, pull.get('head') or {}
                      base_sha = base.get('sha', '')
                      if (pull.get('number') == int(full_pr)
                              and (base.get('repo') or {}).get('full_name') == repo
                              and (head.get('repo') or {}).get('full_name') == repo
                              and base.get('ref') == f"review-base/{base_sha}"
                              and head.get('ref', '').startswith('review/')
                              and release.SHA.fullmatch(base_sha)):
                          upstream = base_sha
                  if not release.SHA.fullmatch(upstream or ''):
                      upstream = 'unresolved'
                  evidence = release.failure_evidence(repo)
                  links = f"\n\nFull workflow: https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
                  for label, key in (("Complete review", "BOOTSTRAP_FULL_PR"),
                                     ("Delta review", "BOOTSTRAP_DELTA_PR")):
                      number = os.environ.get(key, '')
                      if number.isdigit():
                          links += f"\n{label}: https://github.com/{repo}/pull/{number}"
                  release.escalation(repo, os.environ['CONFIG_SHA'], upstream,
                                     'The private native policy bundle could not be verified; candidate tests, '
                                     'activation and macOS never started.\n' + evidence + links)
              else:
                  release.request_repair(pathlib.Path(os.environ['RUNNER_TEMP']) / 'zed-repair',
                                         config=os.environ['CONFIG_SHA'])
          else:
              if os.environ['BOOTSTRAP_BUNDLE_FAILED'] != 'true':
                  raise SystemExit('Trusted controller pin is required for repair outside bootstrap-bundle failure')
              sha_re = re.compile(r'^[0-9a-f]{40}$')
              repo = os.environ['GITHUB_REPOSITORY']
              owner = repo.split('/')[0]
              config = os.environ['CONFIG_SHA']
              token = os.environ['GH_TOKEN']
              class NativeRedirects(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, request, fp, code, message, headers, new_url):
                      target = urllib.parse.urlsplit(new_url)
                      if target.scheme != 'https' or target.netloc != 'api.github.com':
                          raise ValueError('Native API redirect leaves the authenticated GitHub host')
                      return super().redirect_request(request, fp, code, message, headers, new_url)
              opener = urllib.request.build_opener(NativeRedirects())
              def gh_req(route, *, method='GET', payload=None, raw_text=False):
                  headers = {'Accept': 'application/vnd.github+json',
                             'Authorization': f'Bearer {token}',
                             'X-GitHub-Api-Version': '2022-11-28',
                             'User-Agent': 'zed-bootstrap-escalation'}
                  body = None
                  if payload is not None:
                      body = json.dumps(payload).encode('utf-8')
                      headers['Content-Type'] = 'application/json'
                  req = urllib.request.Request('https://api.github.com/' + route.lstrip('/'),
                                               data=body, headers=headers, method=method)
                  with opener.open(req, timeout=60) as resp:
                      raw = resp.read().decode('utf-8', errors='replace')
                  return raw if raw_text else (json.loads(raw) if raw.strip() else None)
              upstream = os.environ['UPSTREAM_SHA']
              full_pr = os.environ['BOOTSTRAP_FULL_PR']
              if not sha_re.fullmatch(upstream or '') and full_pr.isdigit():
                  pull = gh_req(f'repos/{repo}/pulls/{full_pr}')
                  base, head = pull.get('base') or {}, pull.get('head') or {}
                  base_sha = base.get('sha', '')
                  if (pull.get('number') == int(full_pr)
                          and (base.get('repo') or {}).get('full_name') == repo
                          and (head.get('repo') or {}).get('full_name') == repo
                          and base.get('ref') == f'review-base/{base_sha}'
                          and head.get('ref', '').startswith('review/')
                          and sha_re.fullmatch(base_sha)):
                      upstream = base_sha
              if not sha_re.fullmatch(upstream or ''):
                  upstream = 'unresolved'
              run_id = os.environ['GITHUB_RUN_ID']
              lines = [f'Workflow evidence: https://github.com/{repo}/actions/runs/{run_id}']
              jobs = gh_req(f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100') or {}
              for job in jobs.get('jobs', []):
                  if job.get('conclusion') == 'failure':
                      lines.append(f"\nFailed job: {job.get('name')}\n")
                      try:
                          logs = gh_req(f"repos/{repo}/actions/jobs/{job['id']}/logs", raw_text=True)
                          logs = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', logs)
                          logs = re.sub(r'[\x00-\x08\x0b-\x1f\x7f]', '', logs)
                          lines.append(logs[-18000:])
                      except Exception:
                          lines.append(f"Log unavailable; inspect {job.get('html_url')}")
              links = f'\n\nFull workflow: https://github.com/{repo}/actions/runs/{run_id}'
              for label, key in (('Complete review', 'BOOTSTRAP_FULL_PR'),
                                 ('Delta review', 'BOOTSTRAP_DELTA_PR')):
                  number = os.environ.get(key, '')
                  if number.isdigit():
                      links += f'\n{label}: https://github.com/{repo}/pull/{number}'
              reason = ('The private native policy bundle could not be verified; candidate tests, '
                        'activation and macOS never started.\n' + '\n'.join(lines)[-24000:] + links).replace('<!--', '&lt;!--')
              marker = f'<!-- zed-escalation:{config}:{upstream} -->'
              trusted_actors = {('github-actions[bot]', 'Bot'), (owner, 'User')}
              for page in range(1, 1001):
                  batch = gh_req(f'repos/{repo}/issues?state=open&per_page=100&page={page}') or []
                  for issue in batch:
                      user = issue.get('user') if isinstance(issue.get('user'), dict) else {}
                      if (not issue.get('pull_request') and marker in (issue.get('body') or '')
                              and (user.get('login'), user.get('type')) in trusted_actors):
                          raise SystemExit(f"Machine repair remains blocked: {issue.get('html_url')}")
                  if len(batch) < 100:
                      break
              issue = gh_req(f'repos/{repo}/issues', method='POST', payload={
                  'title': 'zed: autonomous repair needs a decision',
                  'assignees': [owner],
                  'body': (
                      f'@{owner} The bounded machine repair did not produce a verified fix. '
                      'Publication is blocked; the last verified release is retained. '
                      'No server deployment or data change is performed by this workflow.\n\n'
                      f'Configuration: `{config}`. Upstream: `{upstream}`.\n\n'
                      f"Evidence:\n```\n{reason[-16000:].replace('```', chr(39) * 3)}\n```\n\n"
                      'Do not weaken review/tests or introduce a workaround.\n\n' + marker),
              })
              raise SystemExit(f"Machine repair escalated: {issue.get('html_url')}")
          PY

  verify-bootstrap-bundle:
    name: Verify Private Native Policy Bundle Before Activation
    if: github.event_name == 'workflow_dispatch' && inputs.policy_bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      policy_ref: ${{ steps.bundle.outputs.policy_ref }}
      maintenance_candidate: ${{ steps.bundle.outputs.maintenance_candidate }}
      delta_pr: ${{ steps.bundle.outputs.delta_pr }}
      delta_base: ${{ steps.bundle.outputs.delta_base }}
      upstream: ${{ steps.bundle.outputs.upstream }}
